services:
  - type: web
    name: weather-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: IDARKMETEO_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
